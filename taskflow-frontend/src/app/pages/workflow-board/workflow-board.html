
<div class="workflow-page">

  <div class="page-heading">
    <div>
      <h1>Workflow Board</h1>
      <p>Track and manage tasks across workflow stages</p>
    </div>

    <button class="add-task-btn" (click)="openCreateTask()">
      + Add Task
    </button>
  </div>

  <div class="workflow-board">

    <div
      class="workflow-column"
      *ngFor="let status of statuses">

      <div class="column-header">
        <h3>{{ status }}</h3>

        <span class="task-count">
          {{ getTasksByStatus(status).length }}
        </span>
      </div>

      <div class="column-content">

        <div
          class="task-card"
          *ngFor="let task of getTasksByStatus(status)">

          <div class="task-top">
            <span
              class="priority"
              [ngClass]="task.priority.toLowerCase()">
              {{ task.priority }}
            </span>

            <span class="task-id">
              #{{ task.id }}
            </span>
          </div>

          <h4>{{ task.title }}</h4>

          <p class="description">
            {{ task.description }}
          </p>

          <div class="task-details">

            <div>
              <span class="detail-label">Assigned To</span>
              <strong>{{ task.assignedTo }}</strong>
            </div>

            <div>
              <span class="detail-label">Due Date</span>
              <strong>{{ task.dueDate | date:'dd MMM yyyy' }}</strong>
            </div>

          </div>

          <div class="task-actions">

            <button
              class="previous-btn"
              [disabled]="!canMovePrevious(task)"
              (click)="moveTask(task, -1)">
              Previous
            </button>

            <button
              class="next-btn"
              [disabled]="!canMoveNext(task)"
              (click)="moveTask(task, 1)">
              Next
            </button>

          </div>

          <div class="crud-actions">

            <button
              class="edit-btn"
              (click)="openEditTask(task)">
              Edit
            </button>

            <button
              class="delete-btn"
              (click)="deleteTask(task)">
              Delete
            </button>

          </div>

        </div>

        <div
          class="empty-state"
          *ngIf="getTasksByStatus(status).length === 0">
          No tasks in this stage
        </div>

      </div>

    </div>

  </div>

</div>

<!-- Task Form Modal -->
<app-task-form
  *ngIf="showTaskForm"
  [task]="selectedTask"
  (save)="saveTask($event)"
  (cancel)="closeTaskForm()">
</app-task-form>
